[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rcsp-warm"
version = "1.0.0"
description = "Exact full-space QAOA for small RCSP instances with WARM/FROZEN/RANDOM training protocols and frozen p=120 study records"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Zhilin Chen" }]
license = "MIT"
license-files = ["LICENSE", "DATA_LICENSE.md", "THIRD_PARTY_NOTICES.md"]
dependencies = ["numpy>=1.26", "scipy>=1.11"]

[project.optional-dependencies]
plot = ["matplotlib>=3.8"]
test = ["pytest>=7.4"]
# Tested with: Python 3.11.15, numpy 2.4.6, scipy 1.17.1, matplotlib 3.11.0, pytest 9.1.1

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
